name: Watch Lever Jobs

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      targets_json:
        description: 'Optional JSON array of Lever targets. Overrides LEVER_TARGETS_JSON for this run.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.17"

      - name: Restore job state cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.lever-watcher
          key: lever-state-${{ github.run_id }}
          restore-keys: |
            lever-state-

      - name: Install
        run: uv sync --locked

      - name: Check jobs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LEVER_TARGETS_JSON: ${{ inputs.targets_json || vars.LEVER_TARGETS_JSON }}
        run: uv run lever-watcher watch-targets

      - name: Save job state cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ~/.lever-watcher
          key: lever-state-${{ github.run_id }}
